    # Cache anonymous home/list pages; cookie/auth requests bypass it.
    location ~ ^/(blog/)?$ {
        proxy_pass http://127.0.0.1:9997;
        proxy_set_header Host $host;
        proxy_set_header X-Scheme $scheme;
        proxy_cache tmpcache;
        proxy_cache_key "home:$scheme:$host:$request_uri";
        proxy_cache_bypass $http_cookie $http_authorization;
        proxy_no_cache $http_cookie $http_authorization;
        proxy_cache_valid 200 60s;
        proxy_cache_lock on;
        proxy_cache_lock_age 30s;
        proxy_cache_background_update on;
        proxy_cache_lock_timeout 30s;
        proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
        proxy_ignore_headers Set-Cookie Cache-Control Expires;
        proxy_hide_header Set-Cookie;
        expires 60s;
        add_header X-Blog-Cache $upstream_cache_status;
    }

    # Public feeds: share generated responses for one minute.
    location ~ ^/blog/feeds/(rss|atom)/$ {
        proxy_pass http://127.0.0.1:9997;
        proxy_set_header Host $host;
        proxy_set_header X-Scheme $scheme;
        proxy_cache tmpcache;
        proxy_cache_key "feed:$scheme:$host:$request_uri";
        proxy_cache_valid 200 60s;
        proxy_cache_lock on;
        proxy_cache_lock_age 30s;
        proxy_cache_background_update on;
        proxy_cache_lock_timeout 30s;
        proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
        proxy_ignore_headers Set-Cookie Cache-Control Expires;
        proxy_hide_header Set-Cookie;
        add_header X-Feed-Cache $upstream_cache_status;
    }
